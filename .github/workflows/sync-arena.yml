name: Preview Are.na content sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch selected Are.na content
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
        run: python3 scripts/sync_arena.py
      - name: Upload generated preview data (not automatically published)
        uses: actions/upload-artifact@v4
        with:
          name: arena-content-preview
          path: data/content.json
          retention-days: 1
